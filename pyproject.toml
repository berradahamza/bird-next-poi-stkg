[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "stkg-cll-poi-bird"
version = "2.0.0"
description = "Visitor-isolated STKG and contrastive next-artwork prediction on BIRD"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "torch>=2.4,<3"]

[tool.setuptools.packages.find]
where = ["."]
include = ["stkg_cll_poi*"]
